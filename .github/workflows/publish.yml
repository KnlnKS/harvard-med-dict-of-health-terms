name: Sync dictionary and publish

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/**
      - data/dictionary.json
      - requirements.txt
      - .github/workflows/publish.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      allow_removals:
        description: Allow a verified entry-count decrease greater than 10%
        type: boolean
        default: false

concurrency:
  group: dictionary-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install importer dependency
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt
      - name: Synchronize all dictionary sections
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ALLOW_REMOVALS: ${{ inputs.allow_removals == true }}
        run: |
          if [ "$ALLOW_REMOVALS" = true ]; then
            python scripts/sync.py --allow-removals
          else
            python scripts/sync.py
          fi
      - name: Commit dictionary changes and daily heartbeat
        if: always() && steps.sync.outcome != 'skipped'
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          ADDED: ${{ steps.sync.outputs.added }}
          EDITED: ${{ steps.sync.outputs.edited }}
          REMOVED: ${{ steps.sync.outputs.removed }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dictionary.json data/sync-status.json
          if ! git diff --cached --quiet; then
            if [ "$CHANGED" = true ]; then
              git commit -m "data: sync Harvard dictionary (+$ADDED / ~$EDITED / -$REMOVED)"
            else
              git commit -m 'chore: record daily dictionary sync heartbeat'
            fi
            git push origin HEAD:main
          fi
      - name: Report synchronization failure
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo '::error::Harvard synchronization failed. The previous dictionary and published site are preserved. See data/sync-status.json for details.'
          exit 1
      - name: Build static website
        id: build
        if: github.event_name == 'push' || steps.sync.outputs.changed == 'true'
        run: |
          python scripts/build.py
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.build.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
