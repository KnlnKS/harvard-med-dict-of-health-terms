name: Sync dictionary and publish

on:
  push:
    branches: [main]
    paths:
      - site/**
      - data/dictionary.json
      - .github/workflows/publish.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      allow_removals:
        description: Allow a verified entry-count decrease greater than 10%
        type: boolean
        default: false

concurrency:
  group: dictionary-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOOL_VERSION: v1.0.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download verified dictionary CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          gh release download "$TOOL_VERSION" --repo "$GITHUB_REPOSITORY" --pattern health-dictionary-linux-x86_64.tar.gz --pattern SHA256SUMS --dir .tools
          cd .tools
          sha256sum --check SHA256SUMS
          tar -xzf health-dictionary-linux-x86_64.tar.gz
      - name: Synchronize all dictionary sections
        if: github.event_name != 'push'
        env:
          ALLOW_REMOVALS: ${{ inputs.allow_removals == true }}
        run: |
          args=()
          if [ "$ALLOW_REMOVALS" = true ]; then
            args+=(--allow-removals)
          fi
          .tools/health-dictionary update "${args[@]}"
      - name: Build static website
        run: .tools/health-dictionary build
      - name: Compare with last successful publication
        id: publication
        run: .tools/health-dictionary publish-needed https://knlnks.github.io/harvard-med-dict-of-health-terms/version.json
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.publication.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
