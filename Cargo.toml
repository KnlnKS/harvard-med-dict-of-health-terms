[package]
name = "health-dictionary"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Import, build, and publish the Harvard health dictionary"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = "3.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
